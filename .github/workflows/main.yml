name: Unpack Remote Vault ZIP

on:
  push:
    branches: [ main ]
    paths:
      - 'Remote Vault.zip'
  workflow_dispatch:

jobs:
  unpack:
    runs-on: ubuntu-latest
    env:
      ZIP: "Remote Vault.zip"
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure unzip installed
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Verify ZIP exists
        run: |
          echo "Looking for ZIP at repo root: '$ZIP'"
          if [ ! -f "$ZIP" ]; then
            echo "ZIP file not found at repo root: $ZIP"
            ls -la
            exit 1
          fi
      - name: List ZIP contents
        run: unzip -l "$ZIP"

      - name: Extract ZIP
        run: unzip -o "$ZIP" -d extracted/

      - name: Move files into target folder
        run: |
          mkdir -p unpacked/remote-vault-d2l
          # include dotfiles when moving
          shopt -s dotglob || true
          if [ -d extracted ]; then
            mv extracted/* unpacked/Obsidian-LLM-WIKI/ || true
          fi
      - name: Commit and push extracted files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unpacked/Remote Vault.zip/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remote Vault.zip into unpacked/Remote Vault/
            git push
          fi
