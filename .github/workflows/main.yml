name: Unpack Remote Vault ZIP

on:
  push:
    branches: [ main ]
    paths:
      - 'Remote Vault.zip'
  workflow_dispatch:

jobs:
  unpack:
    runs-on: ubuntu-latest
    env:
      ZIP: "Remote Vault.zip"
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Debug workspace
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          pwd
          ls -la

      - name: Ensure unzip installed
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Verify ZIP exists
        run: |
          echo "Looking for ZIP at repo root: '$ZIP'"
          if [ ! -f "$ZIP" ]; then
            echo "ZIP file not found at repo root: $ZIP"
            ls -la
            exit 1
          fi

      - name: List ZIP contents
        run: unzip -l "$ZIP"

      - name: Extract ZIP
        run: unzip -o "$ZIP" -d extracted/

      - name: Move files into target folder
        shell: bash
        run: |
          mkdir -p "unpacked/remote-vault"
          shopt -s dotglob
          if [ -d extracted ]; then
            mv extracted/* "unpacked/remote-vault/" || true
          fi

      - name: Commit and push extracted files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "unpacked/remote-vault/"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(workflow): add Remote Vault contents from Remote Vault.zip"
            git push
          fi
